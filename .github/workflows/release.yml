name: Build and release

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release.yml"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "scripts/package-unpack.mjs"
      - "apps/desktop/package.json"
      - "apps/desktop/tsconfig.json"
      - "apps/desktop/vite.config.ts"
      - "apps/desktop/index.html"
      - "apps/desktop/demo.html"
      - "apps/desktop/public/**"
      - "apps/desktop/scripts/**"
      - "apps/desktop/src/**"
      - "apps/desktop-server/package.json"
      - "apps/desktop-server/tsconfig.json"
      - "apps/desktop-server/src/**"
      - "packages/adapters/package.json"
      - "packages/adapters/tsconfig.json"
      - "packages/adapters/src/**"
      - "packages/core/package.json"
      - "packages/core/tsconfig.json"
      - "packages/core/src/**"
      - "packages/shared/package.json"
      - "packages/shared/tsconfig.json"
      - "packages/shared/src/**"
      - "!apps/desktop/src/**/*.test.ts"
      - "!apps/desktop-server/src/**/*.test.ts"
      - "!packages/**/src/**/*.test.ts"

permissions:
  contents: write

jobs:
  release:
    name: Package Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@10.28.2

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build unpacked application
        shell: pwsh
        run: |
          $bundle = "release/another-workbench-unpacked-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          "AWB_UNPACK_OUTPUT_DIR=$bundle" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:AWB_UNPACK_OUTPUT_DIR = $bundle
          pnpm package:unpack

      - name: Create release assets
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bundle = $env:AWB_UNPACK_OUTPUT_DIR
          $archive = "release/another-workbench-windows-x64.zip"
          $checksumFile = "release/SHA256SUMS.txt"
          $requiredFiles = @(
            "$bundle/another-workbench.exe"
            "$bundle/resources/app/package.json"
          )
          $missingFiles = @(
            $requiredFiles | Where-Object {
              -not (Test-Path -LiteralPath $_ -PathType Leaf)
            }
          )

          if ($missingFiles.Count -gt 0) {
            throw "Package is missing required files: $($missingFiles -join ', ')"
          }

          Compress-Archive `
            -LiteralPath $bundle `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $(Split-Path -Leaf $archive)" |
            Set-Content -LiteralPath $checksumFile -Encoding ascii

          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $tag = "build-$env:GITHUB_RUN_NUMBER-$shortSha"
          $title = "Another Workbench build #$env:GITHUB_RUN_NUMBER ($shortSha)"
          $commitSubject = git log -1 --pretty=format:%s

          @(
            "Automated Windows x64 build from commit $env:GITHUB_SHA."
            ""
            $commitSubject
          ) | Set-Content -LiteralPath "release/release-notes.md" -Encoding utf8

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @(
            "release/another-workbench-windows-x64.zip#Windows x64 portable build"
            "release/SHA256SUMS.txt#SHA-256 checksums"
          )

          $ErrorActionPreference = "SilentlyContinue"
          gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"

          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG @assets `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --notes-file "release/release-notes.md"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed with exit code $LASTEXITCODE."
          }
